name: Create release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test and validate repository
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
          python tools/check_repo.py
          python -c 'import os; from verbalia_open import __version__; assert os.environ["GITHUB_REF_NAME"] == "v" + __version__'
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Package skill and release notes
        run: |
          python tools/package_skill.py
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '$1 == "##" { if (found) exit; found = ($2 == version); next } found { print }' CHANGELOG.md > dist/release-notes.md
          grep -q '[^[:space:]]' dist/release-notes.md
          (cd dist && sha256sum verbalia-open-skill.zip > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/verbalia-open-skill.zip dist/SHA256SUMS.txt \
            --title "Verbalia Open $GITHUB_REF_NAME" --notes-file dist/release-notes.md --verify-tag
