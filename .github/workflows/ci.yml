name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate skill and sample data
        run: |
          python tools/check_repo.py
          verbalia validate examples/condominio.json
          verbalia validate examples/cda.json
          verbalia validate examples/cantiere.json
          verbalia bundle examples/condominio.json --out output/test
          test -s output/test/verbale-bozza.md
